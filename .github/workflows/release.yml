name: Release

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Publish core first, then Redis after its preparation PR
        required: true
        type: choice
        options: [core, redis]
      version:
        description: Version to publish (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate version and release files
        env:
          RELEASE_PHASE: ${{ inputs.phase }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/release.py "check-$RELEASE_PHASE" "$RELEASE_VERSION"

  ci:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish release
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag modules and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PHASE: ${{ inputs.phase }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/scripts/release.py "publish-$RELEASE_PHASE" "$RELEASE_VERSION"
