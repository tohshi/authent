name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Release tooling tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Dependency policy (stdlib and golang.org/x only)
        run: |
          disallowed=$(go list -deps -test -f '{{with .Module}}{{if not .Main}}{{.Path}}{{end}}{{end}}' ./... | sort -u | grep -v '^golang\.org/x/' || true)
          if [ -n "$disallowed" ]; then
            echo "Only golang.org/x/* modules are allowed as dependencies:"
            echo "$disallowed"
            exit 1
          fi
      - name: Redis consumer module
        run: bash .github/scripts/check-redis-consumer.sh
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/fuzz.sh
        env:
          FUZZTIME: 15s

  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: authent
          POSTGRES_DB: authent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTHENT_REQUIRE_INTEGRATION: "1"
      AUTHENT_POSTGRES_DSN: postgres://postgres:authent@localhost:5432/authent?sslmode=disable
      AUTHENT_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Nested modules
        run: |
          for mod in $(find . -mindepth 2 -name go.mod -not -path './.git/*' | sort); do
            dir=$(dirname "$mod")
            echo "::group::$dir"
            (cd "$dir" &&
              go vet ./... &&
              go mod tidy &&
              git diff --exit-code -- go.mod go.sum &&
              go run golang.org/x/vuln/cmd/govulncheck@latest ./... &&
              go test -race -count=1 ./...) || exit 1
            echo "::endgroup::"
          done
