version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "all"
  - package-ecosystem: gomod
    directory: /integration
    schedule:
      interval: weekly
    commit-message:
      prefix: "integration"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ".github"
