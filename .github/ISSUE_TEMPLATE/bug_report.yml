name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security issues must not be reported here.** If the bug lets something
        through that should be rejected, follow [SECURITY.md](https://github.com/tohshi/authent/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: authent version
      description: Release tag or commit hash.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      description: Output of `go version`.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [authent, jwt, oidc, password, rebac, session]
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include a minimal reproduction, ideally a Go test.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
